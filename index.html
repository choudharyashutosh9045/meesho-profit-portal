// ===== IMPORT ENGINE =====
function normDate(v){if(!v)return'';if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);if(d)return D(d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0'));return'';}
v=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(v))return D(v.slice(0,10));
const m=v.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return`${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}-${m[3]}`;return v;}
function ensureProduct(sku,name,price){if(!sku)return null;let p=DB.products.find(p=>p.sku===sku);
if(!p){p={id:uid(),name:(name||sku).slice(0,60),sku,gst:18,price:+price||0,cost:0,stock:0,lowAt:5};DB.products.push(p);}
if(price&&!p.price)p.price=+price;return p;}
function mapStatus(raw){if(!raw)return'New';const r=String(raw).toUpperCase();
if(r.includes('RTO'))return'RTO';if(r.includes('CUSTOMER_RETURN')||r==='CUSTOMER RETURN')return'Customer Return';
if(r.includes('CANCEL'))return'Cancelled';if(r.includes('DELIVER'))return'Delivered';if(r.includes('REFUND'))return'Refund';
if(r.includes('SHIP'))return'Shipped';if(r.includes('READY'))return'New';return'New';}
function findRow(ws){const r=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
const idx=r.findIndex(row=>row&&row.filter(c=>c&&String(c).trim()).length>=5&&!String(row[0]||'').includes('Supplier'));
return idx<0?0:idx;}
function parseFile(file,kind){return new Promise(res=>{const fr=new FileReader();
fr.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:false});
const ws=wb.Sheets[wb.SheetNames[0]];const start=findRow(ws);
const rows=XLSX.utils.sheet_to_json(ws,{defval:'',range:start});
res({file,rows});}catch(err){res({file,rows:[],error:err.message});}};
fr.onerror=()=>res({file,rows:[],error:'Could not read file'});
if(/\.csv$/i.test(file.name))fr.readAsText(file);else fr.readAsArrayBuffer(file);});}
function pick(row,keys){for(const k of keys){const hit=Object.keys(row).find(h=>h.toLowerCase().includes(k.toLowerCase()));if(hit&&row[hit]!=='')return row[hit];}return'';}
async function handleAll(files){let report=[];
for(const f of files){const name=f.name.toLowerCase();
let kind='orders';
if(name.includes('intransit')||name.includes('in-transit')||name.includes('return'))kind='returns';
else if(name.includes('completed')||name.includes('delivered'))kind='delivered';
else if(name.includes('payment')||name.includes('settlement'))kind='payments';
const r=await handleFiles([f],kind,true);report.push(`<div class="slot"><div class="done">✅ ${f.name} (${kind}) → ${r}</div></div>`);}
document.getElementById('importResult').innerHTML=report.join('');save();render();toast('Import complete ✔');cur='Import Files';render();}
async function handleFiles(files,kind,silent){
if(!files||!files.length)return'0 new';const {file}=await parseFile(files[0],kind);
if(!file)return'0 new';const {rows,error}=await parseFile(file,kind);
if(error){toast('Parse error: '+error,false);return'error';}
let added=0,skipped=0,updated=0,ads=0;
rows.forEach(r=>{
if(kind==='payments'){const sub=String(pick(r,['Sub Order No','Suborder'])||'').trim();
const detail=String(pick(r,['Revenue and deductions','Revenue'])||'');
const fin=parseFloat(String(pick(r,['Final Settlement','Final settlement amount'])||'').replace(/[^\d.\-]/g,''))||0;
const adAmt=parseFloat(String(pick(r,['Ads Cost','Ads cost','Ads'])||'').replace(/[^\d.\-]/g,''))||0;
if(adAmt>0){const pd=D(String(pick(r,['Payment Date'])||'')||'');DB.expenses.push({id:uid(),date:pd||'—',type:'Ads',desc:'Imported ads · '+(sub||file.name.slice(0,20)),amt:adAmt});ads++;}
if(sub){const o=DB.orders.find(o=>o.id===sub);
if(o){o.payDate=D(String(pick(r,['Payment Date'])||''))||o.payDate;o.txn=String(pick(r,['Transaction ID'])||'')||o.txn;o.net=fin;updated++;}
else if(fin>0){const sku=String(pick(r,['Supplier SKU','SKU'])||'');const p=ensureProduct(sku,pick(r,['Product Name','Product']),pick(r,['Listing Price']));
DB.orders.push({id:sub,date:D(String(pick(r,['Order Date'])||'').slice(0,10))||'—',prod:p?p.id:'?',qty:+pick(r,['Quantity'])||1,sale:parseFloat(String(pick(r,['Total Sale Amount'])||'').match(/[\d.]+/)?.[0])||0,net:fin,status:mapStatus(pick(r,['Live Order Status'])),src:'Payment Import',txn:pick(r,['Transaction ID'])||'',payDate:D(String(pick(r,['Payment Date'])||''))||'',reason:''});added++;}}
return;}
const sub=String(pick(r,['Suborder Number','Sub Order No','Suborder No'])||'').trim();
if(!sub||sub==='NA'){skipped++;return;}
const sku=String(pick(r,['Supplier SKU','SKU'])||'').trim();
if(!sku){skipped++;return;}
const p=ensureProduct(sku,pick(r,['Product Name','Product']),pick(r,['Supplier Listed Price','Listing Price','Supplier Discounted Price']));
const tRet=String(pick(r,['Type of Return','Type'])||'');
let st,statusChange=false;
if(kind==='orders'){st=mapStatus(pick(r,['Reason for Credit Entry','Reason','Status']));}
else{st=tRet.includes('RTO')?'RTO':'Customer Return';}
const existing=DB.orders.find(o=>o.id===sub);
if(existing){if(['RTO','Customer Return'].includes(st)&&existing.status!==st){existing.status=st;existing.reason=pick(r,['Return Reason','Detailed Return Reason'])||existing.reason||'';existing.payDate=D(String(pick(r,['Return Created Date'])||''))||existing.payDate;updated++;}
else{skipped++;}return;}
const od=D(String(pick(r,['Order Date','Dispatch Date'])||'').slice(0,10));
DB.orders.push({id:sub,date:od||'—',prod:p?p.id:'?',qty:+pick(r,['Quantity','Qty'])||1,
sale:parseFloat(String(pick(r,['Supplier Listed Price','Supplier Discounted Price','Listing Price'])||'').replace(/[^\d.]/g,''))||0,
net:null,status:st,src:'Import · '+kind,txn:'',payDate:D(String(pick(r,['Return Created Date'])||''))||'',reason:tRet.includes('RTO')?'forward_RTO':(pick(r,['Return Reason'])||''),state:String(pick(r,['Customer State','State'])||'')});added++;});
const msg=`✅ ${file.name} (${kind}): <b>${added} new</b> orders · ${updated} status/payment updates · ${skipped} duplicates/empty skipped${ads?' · '+ads+' ad records':''}`;
if(silent)return msg;
document.getElementById('importResult').innerHTML=`<div class="okmsg">${msg}</div>`;
save();render();toast('Imported: '+added+' new, '+updated+' updated');return msg;}
function setupDragDrop(){const ov=document.getElementById('dragOverlay');
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();ov.style.display='flex';}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='dragleave'&&e.relatedTarget)return;e.preventDefault();ov.style.display='none';}));
document.addEventListener('drop',e=>{if(e.dataTransfer.files.length)handleAll(e.dataTransfer.files);});}
function renderOrders(){const q=(document.getElementById('fq').value||'').toLowerCase(),fs=document.getElementById('fs').value,fp=document.getElementById('fp').value;
const rows=DB.orders.filter(o=>(!fs||o.status===fs)&&(!fp||o.prod===fp)&&(!q||o.id.toLowerCase().includes(q)));
document.getElementById('ot').innerHTML=`<table><tr><th>Order ID</th><th>Date</th><th>Product</th><th>State</th><th>₹ Sale</th><th>Status</th><th>Source</th><th>Payment</th><th></th></tr>
${rows.map(o=>`<tr><td>${o.id}</td><td>${o.date}</td><td>${pname(o.prod)}</td><td>${o.state||'—'}</td><td>${o.sale?fmt(o.sale):'—'}</td><td><span class="badge ${BC[o.status]||''}" onclick="chgStatus('${o.id}')" style="cursor:pointer">${o.status}</span></td><td>${o.src}</td><td>${o.payDate||'—'}</td><td><button class="sm" onclick="delRec('orders','${o.id}')">✕</button></td></tr>`).join('')}</table>${rows.length?'':'<div class="empty">No matching orders.</div>'}`;}
function chgStatus(id){const o=DB.orders.find(x=>x.id===id);const ns=prompt('New status:\n'+STATUS.join(' | '),o.status);if(!ns||!STATUS.includes(ns))return;
const old=o.status;o.status=ns;const p=DB.products.find(p=>p.id===o.prod);
if(old!=='Delivered'&&ns==='Delivered'&&p&&p.stock>0)p.stock=Math.max(0,p.stock-o.qty);
if(old==='Delivered'&&['RTO','Customer Return'].includes(ns)&&p)p.stock+=o.qty;
save();render();toast('Status → '+ns);}
function markRestocked(id){const o=DB.orders.find(x=>x.id===id);const p=DB.products.find(p=>p.id===o.prod);if(p){p.stock+=o.qty;save();toast('Stock restored: '+pname(o.prod));}}
function setStock(id,v){DB.products.find(p=>p.id===id).stock=+v||0;save();}

save();render();toast('Order added ✔');}

function saveExp(){DB.expenses.push({id:uid(),date:e_date.value||'—',type:e_type.value,desc:e_desc.value||'-',amt:+e_amt.value||0});save();render();toast('Saved ✔');}
function gstForm(){document.getElementById('view').insertAdjacentHTML('beforeend',`<div class="panel"><b>Add GST Month</b><div class="formrow">
<div><label>Month</label><input id="g_m"></div><div><label>Output GST ₹</label><input id="g_out" type="number"></div><div><label>ITC ₹</label><input id="g_itc" type="number"></div><div><label>Paid ₹</label><input id="g_paid" type="number"></div><div><label>Status</label><select id="g_st"><option>Not filed</option><option>Filed</option></select></div></div>
<button class="act" onclick="saveGst()">Save</button></div>`);window.scrollTo(0,document.body.scrollHeight);}
function saveGst(){DB.gst.push({m:g_m.value||'—',output:+g_out.value||0,itc:+g_itc.value||0,paid:+g_paid.value||0,status:g_st.value});save();render();toast('Saved ✔');}
function delRec(coll,key){if(!confirm('Delete this record?'))return;DB[coll]=DB[coll].filter(x=>x.id!==key);save();render();}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='msm_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded ✔');}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.orders)throw 0;DB=d;save();render();toast('Restored ✔');}catch(e){toast('Invalid backup file',false);}};r.readAsText(i.files[0]);};i.click();}
render();
