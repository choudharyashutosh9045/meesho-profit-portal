<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meesho Profit Portal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1e2433;--mut:#6b7280;--acc:#7c3aed;--ok:#059669;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:220px;background:#1e1b3a;color:#cfd2ff;padding:16px;flex-shrink:0}
aside h1{font-size:17px;color:#fff;margin-bottom:18px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfd2ff;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:4px}
aside button.active,aside button:hover{background:rgba(255,255,255,.12);color:#fff}
main{flex:1;padding:20px;max-width:1100px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
h2{font-size:18px;margin-bottom:12px}
h3{font-size:15px;margin:10px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#f4f2ff;border-radius:12px;padding:14px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #eceef5;text-align:left}
th{color:var(--mut);font-weight:600}
.drop{border:2px dashed var(--acc);border-radius:14px;padding:34px;text-align:center;cursor:pointer;transition:.2s}
.drop.over{background:#f1ecff}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px;margin:6px 6px 6px 0}
.btn.gray{background:#e5e7eb;color:var(--ink)}
.msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px;white-space:pre-line;display:none}
.msg.ok{display:block;background:#ecfdf5;color:var(--ok)}
.msg.err{display:block;background:#fef2f2;color:var(--bad)}
input,select{padding:8px;border:1px solid #d7dae6;border-radius:8px;font-size:14px;max-width:140px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.note{font-size:12px;color:var(--warn);margin-top:8px}
.cloudBadge{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:8px;display:inline-block}
.cloudOn{background:#ecfdf5;color:var(--ok)} .cloudOff{background:#fef3c7;color:var(--warn)}
details{margin-top:10px}
details summary{cursor:pointer;font-size:12.5px;color:var(--mut)}
pre{white-space:pre-wrap;font-size:11px;background:#f6f7fb;border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-top:8px;max-height:220px;overflow-y:auto}
@media(max-width:720px){body{flex-direction:column}aside{width:100%;display:flex;overflow-x:auto}aside h1{display:none}aside button{white-space:nowrap;width:auto}}
</style>
</head>
<body>
<aside id="nav"></aside>
<main id="view"></main>
<script>
/* ============ STATE + NORMALIZATION ============ */
const DEF_SETTINGS={gstRate:18,returnLoss:0,adsCost:0,otherFlat:0,rtoLoss:0,lowStock:5,otherChg1:0,otherChg2:0,owner1:"Owner 1",owner2:"Owner 2",shopName:"My Store",supabaseUrl:"",supabaseKey:"",ver:2};
function blankState(){return {orders:[],otherCosts:[],stock:{},skuCost:{},skuPack:{},skuOwner:{},settlements:[],returnsMap:{},fileSums:{},legacyData:false,payments:{},dashMonth:"",settings:{...DEF_SETTINGS}}}
function isoDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date){return isNaN(v)?"":v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0")}
  if(typeof v==="number"&&v>20000&&v<80000){const p=XLSX.SSF.parse_date_code(v);if(p)return p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0")}
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  const d=new Date(s);return isNaN(d)?"":isoDate(d);
}
function normalize(x){
  const s=x&&typeof x==="object"?x:{};
  const safeArr=v=>Array.isArray(v)?v.filter(r=>r&&typeof r==="object"):[];
  const safeObj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:{};
  const st={...DEF_SETTINGS,...safeObj(s.settings)};
  /* orders saved before this version were read with the old import rules (payment-file rows were treated as orders) */
  const legacy=s.legacyData!==undefined?!!s.legacyData:(!(num(safeObj(s.settings).ver)>=2)&&safeArr(s.orders).length>0);
  /* one-time migration: the old "₹170 guess per return" booked losses before Meesho had actually deducted anything */
  if(!(num(safeObj(s.settings).ver)>=2)){if(num(st.returnLoss)===170)st.returnLoss=0;st.ver=2}
  return {
    orders:safeArr(s.orders).map(o=>({subOrder:String(o.subOrder||""),order:String(o.order||""),sku:String(o.sku||""),qty:Math.max(1,num(o.qty)||1),price:num(o.price),status:String(o.status||"New"),date:isoDate(o.date),loss:o.loss!=null?num(o.loss):undefined})),
    otherCosts:safeArr(s.otherCosts),
    stock:safeObj(s.stock),skuCost:safeObj(s.skuCost),skuPack:safeObj(s.skuPack),skuOwner:safeObj(s.skuOwner),
    settlements:safeArr(s.settlements).map(t=>({subOrder:String(t.subOrder||""),amount:num(t.amount),scheduled:!!t.scheduled,date:String(t.date||"")})),
    returnsMap:safeObj(s.returnsMap),fileSums:safeObj(s.fileSums),legacyData:legacy,
    payments:safeObj(s.payments),
    dashMonth:typeof s.dashMonth==="string"?s.dashMonth:"",
    settings:st
  };
}
let S;
try{S=normalize(JSON.parse(localStorage.getItem("meeshoPortal")||"null"));}catch(e){S=blankState();}
function save(){localStorage.setItem("meeshoPortal",JSON.stringify(S));localStorage.setItem("meeshoPortalTs",new Date().toISOString());cloudPush();}
function fmt(n){return "₹"+(Math.round((n||0)*100)/100).toLocaleString("en-IN")}
function dmy(d){const m=String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[3]+"-"+m[2]+"-"+m[1];if(!d)return "—";const x=new Date(d);return isNaN(x)?"—":String(x.getDate()).padStart(2,"0")+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+x.getFullYear()}
function monthKey(d){const m=String(d||"").match(/^(\d{4})-(\d{2})/);if(m)return m[1]+"-"+m[2];if(!d)return "";const x=new Date(d);return isNaN(x)?"":x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")}
function monthLabel(k){if(!k)return "";const p=k.split("-");return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]+" "+p[0]}
function num(x){const n=parseFloat(String(x==null?"":x).replace(/[₹,\s]/g,""));return isNaN(n)?0:n}

/* ============ SUPABASE CLOUD SYNC ============ */
/* Strip the usual copy-paste mistakes: invisible/zero-width characters, quotes or
   backticks picked up from a chat message, a trailing slash, or an accidentally
   included /rest/v1 path — so a slightly messy paste still works instead of failing. */
function cleanText(v){return String(v||"").replace(/[\u200B-\u200D\uFEFF\u00A0\r\n\t]/g,"").replace(/[`'"“”‘’]/g,"").trim()}
function sanitizeSupabaseUrl(u){
  u=cleanText(u);
  u=u.replace(/\/rest\/v1\/?$/i,"");
  u=u.replace(/\/+$/,"");
  if(/^[a-z0-9-]+\.supabase\.co$/i.test(u))u="https://"+u; /* pasted without https:// */
  return u;
}
function cloudCfg(){const s=S.settings||{};return {url:sanitizeSupabaseUrl(s.supabaseUrl),key:cleanText(s.supabaseKey)}}
function cloudReady(){const c=cloudCfg();return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(c.url)&&c.key.length>20}
let cloudPushTimer=null;
async function describeHttpError(res){
  let body="";
  try{ body=(await res.text()).slice(0,140); }catch(e){}
  if(res.status===401||res.status===403)return "⚠ Rejected ("+res.status+") — check the anon key is pasted correctly";
  if(res.status===404)return "⚠ Table not found (404) — run the setup SQL in Supabase first";
  if(body)return "⚠ Sync failed ("+res.status+"): "+body;
  return "⚠ Sync failed ("+res.status+")";
}
function cloudPush(){
  if(!cloudReady())return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(async()=>{
    try{
      const c=cloudCfg();
      // A single upsert (insert, or update on primary-key conflict) instead of
      // PATCH-then-POST-fallback — a PATCH that matches zero rows still
      // returns 200 OK in PostgREST, which made the old code claim "Synced"
      // even when nothing was actually saved.
      const res=await fetch(c.url+"/rest/v1/appdata",{
        method:"POST",
        headers:{"apikey":c.key,"Authorization":"Bearer "+c.key,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
        body:JSON.stringify([{id:1,payload:JSON.stringify(S),updated_at:new Date().toISOString()}])
      });
      if(res.ok){setCloudBadge(true,"☁ Synced "+new Date().toLocaleTimeString());return}
      setCloudBadge(false,await describeHttpError(res));
    }catch(e){setCloudBadge(false,"⚠ Cloud offline — saved locally ("+e.message+")")}
  },800);
}
async function cloudPull(){
  if(!cloudReady())return false;
  try{
    const c=cloudCfg();
    const res=await fetch(c.url+"/rest/v1/appdata?id=eq.1&select=payload,updated_at",{headers:{"apikey":c.key,"Authorization":"Bearer "+c.key}});
    if(!res.ok){setCloudBadge(false,await describeHttpError(res));return false}
    const rows=await res.json();
    if(!rows.length){setCloudBadge(true,"☁ Connected — no cloud data yet");return false}
    const localTs=localStorage.getItem("meeshoPortalTs")||"";
    const cloudTs=rows[0].updated_at||"";
    if(cloudTs>localTs){
      S=normalize(JSON.parse(rows[0].payload));
      localStorage.setItem("meeshoPortal",JSON.stringify(S));
      localStorage.setItem("meeshoPortalTs",cloudTs);
      setCloudBadge(true,"☁ Restored from cloud");
    }else{setCloudBadge(true,"☁ Connected — local data is newer")}
    return true;
  }catch(e){setCloudBadge(false,"⚠ Cloud offline — using local data");return false}
}
let lastCloudStatus=null; // {ok,text} — the real outcome of the last sync attempt, kept across re-renders
function setCloudBadge(ok,text){
  lastCloudStatus={ok:ok,text:text};
  const b=document.getElementById("cloudBadge");
  if(b){b.className="cloudBadge "+(ok?"cloudOn":"cloudOff");b.textContent=text}
}
function cloudBadgeHTML(){
  // Once we actually know something real (synced / restored / an error), keep
  // showing that even after the Settings view re-renders — otherwise a plain
  // render() right after a sync attempt wipes the real status back to this
  // generic placeholder, which looked like "it's broken" even when it worked.
  if(lastCloudStatus)return '<div id="cloudBadge" class="cloudBadge '+(lastCloudStatus.ok?"cloudOn":"cloudOff")+'">'+esc(lastCloudStatus.text)+'</div>';
  if(!cloudReady())return '<div id="cloudBadge" class="cloudBadge cloudOff">☁ Cloud not configured</div>';
  return '<div id="cloudBadge" class="cloudBadge cloudOn">☁ Connecting…</div>';
}

/* ============ NAV ============ */
const TABS=["Dashboard","Upload data","All orders","Cost & owners","Other cost","Stock","Returns","Received payment","Pending payment","Settings"];
let cur="Dashboard";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function renderNav(){
  document.getElementById("nav").innerHTML="<h1>📦 "+esc(S.settings.shopName||"Meesho Portal")+"</h1>"+
    TABS.map(t=>`<button data-tab="${t}" class="${t===cur?'active':''}">${t}</button>`).join("");
}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;cur=b.dataset.tab;renderNav();render();});
function render(){
  const v=document.getElementById("view");
  const fns={"Dashboard":vDash,"Upload data":vUpload,"All orders":vOrders,"Cost & owners":vCost,"Other cost":vOther,"Stock":vStock,"Returns":vReturns,"Received payment":vReceived,"Pending payment":vPending,"Settings":vSettings};
  try{v.innerHTML=fns[cur]();if(cur==="Dashboard")drawCharts();}
  catch(err){v.innerHTML='<div class="card"><h2>Something went wrong</h2><p style="color:var(--bad)">'+esc(err.message)+'</p></div>';}
}

/* ============ IMPORT ENGINE ============ */
const ALIAS={
  subOrder:["sub order no","suborder no","sub order number","suborder number","sub_order_no"],
  order:["order no","order number","order id"],
  item:["product name","item name","item"],
  sku:["supplier sku","sku","style id","product id"],
  qty:["quantity","qty"],
  price:["supplier discounted price","sale amount","item total","supplier price"],
  status:["reason for credit entry","order status","item status","status"],
  date:["order date","order date time","created at"]
};
function norm(s){return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function findHeaderRow(rows){for(let i=0;i<Math.min(rows.length,12);i++){const cells=(rows[i]||[]).map(norm);let hits=0;for(const k in ALIAS)if(cells.some(c=>ALIAS[k].some(a=>c===a||c.includes(a))))hits++;if(hits>=2)return i}return 0}
/* exact header match wins over a "contains" match, so e.g. "Reason for Credit Entry" is preferred over any other column that merely mentions "status" */
function mapCols(header){
  const h=(header||[]).map(norm),m={};
  for(const k in ALIAS){
    let i=-1;
    for(const a of ALIAS[k]){i=h.findIndex(c=>c===a);if(i>-1)break}
    if(i<0)for(const a of ALIAS[k]){i=h.findIndex(c=>c.includes(a));if(i>-1)break}
    if(i>-1)m[k]=i;
  }
  return m;
}
function mapStatus(raw){
  const r=norm(raw);if(!r)return "New";
  if(/cancel/.test(r))return "Cancelled";
  if(/\brto\b|courier return/.test(r))return "RTO";
  if(/return/.test(r))return "Customer Return";
  if(/deliver/.test(r))return "Delivered";
  if(/ship|transit|dispatch|ready/.test(r))return "Shipped";
  return "New";
}
function sheetRows(ws){return XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true})}
function parseOrderRows(raw,label){
  const hRow=findHeaderRow(raw),map=mapCols(raw[hRow]);
  if(map.subOrder===undefined)throw new Error(label+": could not find the Sub Order No column.");
  let added=0,dup=0;const seen=new Set(S.orders.map(o=>o.subOrder));
  for(let i=hRow+1;i<raw.length;i++){
    const r=raw[i];if(!r||!r.length)continue;
    const sub=String(r[map.subOrder]==null?"":r[map.subOrder]).trim();
    if(!sub||sub.length<5)continue;
    if(seen.has(sub)){dup++;continue}
    seen.add(sub);
    /* cost prices are keyed by product name (same as the Sales Manager sheet), falling back to the SKU code */
    const name=map.item!==undefined?String(r[map.item]||"").trim():"";
    const code=map.sku!==undefined?String(r[map.sku]||"").trim():"";
    S.orders.push({subOrder:sub,order:map.order!==undefined?String(r[map.order]||"").trim():sub,sku:name||code,qty:Math.max(1,num(map.qty!==undefined?r[map.qty]:1)||1),price:num(map.price!==undefined?r[map.price]:0),status:mapStatus(map.status!==undefined?r[map.status]:""),date:isoDate(map.date!==undefined?r[map.date]:"")});
    added++;
  }
  return {added:added,dup:dup};
}
/* Completed / Intransit exports: tells us which orders are Courier Return (RTO) or Customer Return */
function parseReturnRows(rows,sum){
  const hr=rows.findIndex(r=>r.some(c=>norm(c)==="suborder number"||norm(c)==="sub order number"));
  if(hr<0)return;
  const h=rows[hr].map(norm);
  const iSub=h.findIndex(c=>c==="suborder number"||c==="sub order number"),iTy=h.findIndex(c=>c==="type of return");
  if(iTy<0)return;
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i];const sub=String(r[iSub]==null?"":r[iSub]).trim();if(!sub)continue;
    const t=norm(r[iTy]);let ty="";
    if(/\brto\b|courier/.test(t))ty="RTO";else if(/customer/.test(t))ty="Customer Return";
    if(!ty)continue;
    if(S.returnsMap[sub]!==ty){if(S.returnsMap[sub]===undefined)sum.returns++;S.returnsMap[sub]=ty}
  }
}
/* One order can have several payment rows over time (sale credit on one date, a return/recovery deduction later).
   Rows are told apart by order + payment date + amount, so re-uploading the same file never double counts,
   while a later deduction for the same order is added on top — exactly like SUMIF in the Excel. */
function settlementIndex(){
  const idx={},cnt={};
  S.settlements.forEach(t=>{
    if(!t.scheduled){idx[t.subOrder+"|U"]=t;return}
    const base=t.subOrder+"|"+t.date+"|"+t.amount;cnt[base]=(cnt[base]||0)+1;idx[base+"|"+cnt[base]]=t;
  });
  return idx;
}
function addSettlement(idx,occ,sub,amt,paid,date,sum){
  amt=Math.round(amt*100)/100;
  if(!paid){
    const ex=idx[sub+"|U"];
    if(ex){ex.amount=amt}else{const t={subOrder:sub,amount:amt,scheduled:false,date:""};S.settlements.push(t);idx[sub+"|U"]=t;sum.pending++}
    return;
  }
  const base=sub+"|"+date+"|"+amt;const n=(occ[base]=(occ[base]||0)+1);const k=base+"|"+n;
  if(idx[k])return;
  const t={subOrder:sub,amount:amt,scheduled:true,date:date};S.settlements.push(t);idx[k]=t;sum.settled++;
}
/* an "unscheduled" (expected) amount is dropped as soon as a real payment exists for that order */
function prunePending(){
  const hasPaid={};S.settlements.forEach(t=>{if(t.scheduled)hasPaid[t.subOrder]=true});
  S.settlements=S.settlements.filter(t=>t.scheduled||!hasPaid[t.subOrder]);
}
/* Payment file → "Order Payments" sheet only. It must never create orders (its amounts are settlements, not sale prices). */
function parsePaymentRows(rows,sum){
  const hr=rows.findIndex(r=>r.some(c=>norm(c)==="sub order no"));
  if(hr<0)return;
  const h=rows[hr].map(norm);
  const iSub=h.indexOf("sub order no"),iAmt=h.indexOf("final settlement amount"),iSt=h.indexOf("live order status"),iDt=h.indexOf("payment date");
  if(iAmt<0)return;
  const idx=settlementIndex(),occ={};
  for(let i=hr+1;i<rows.length;i++){
    const r=rows[i];const sub=String(r[iSub]==null?"":r[iSub]).trim();
    if(!/^\d+_\d+$/.test(sub))continue;
    const amt=num(r[iAmt]);
    const pd=iDt>-1?r[iDt]:"";
    const paid=!(pd===""||/unsched/i.test(String(pd)));
    addSettlement(idx,occ,sub,amt,paid,paid?isoDate(pd):"",sum);
    const live=norm(iSt>-1?r[iSt]:"");
    if(S.returnsMap[sub]===undefined){
      if(/\brto\b/.test(live)){S.returnsMap[sub]="RTO";sum.returns++}
      else if(/return/.test(live)){S.returnsMap[sub]="Customer Return";sum.returns++}
    }
  }
  prunePending();
}
/* Ads / Referral / Compensation sheets: sum only the real amount column (never IDs or dates), once per file */
function extractSum(rows,key,colNames,fileName){
  let hr=-1,ci=-1;
  for(let i=0;i<Math.min(rows.length,12)&&hr<0;i++){const h=(rows[i]||[]).map(norm);for(const nm of colNames){const j=h.findIndex(c=>c.includes(nm));if(j>-1){hr=i;ci=j;break}}}
  if(hr<0)return 0;
  let sum=0;
  for(let i=hr+1;i<rows.length;i++){const v=rows[i][ci];if(typeof v==="number"||/^-?[\d,.]+$/.test(String(v).trim()))sum+=num(v)}
  sum=Math.round(sum*100)/100;
  if(!S.fileSums)S.fileSums={};
  S.fileSums[fileName+"|"+key]=sum;
  S.payments[key]=Math.round(Object.keys(S.fileSums).filter(k=>k.endsWith("|"+key)).reduce((a,k)=>a+S.fileSums[k],0)*100)/100;
  return sum;
}
/* Import the user's own MEESHO_SALES_MANAGER.xlsx (ORDERS / ITEMS / PAYMENTS / RETURNRTO / DASHBOARD) so the app starts from exactly the same data */
function importSalesManager(wb,sum){
  const get=n=>wb.Sheets[wb.SheetNames.find(x=>x.toUpperCase()===n)];
  const it=sheetRows(get("ITEMS")),dash=get("DASHBOARD")?sheetRows(get("DASHBOARD")):[];
  const found=[];
  it.slice(1).forEach(r=>{const ow=String(r[1]||"").trim();if(String(r[0]||"").trim()&&ow&&!found.includes(ow))found.push(ow)});
  const o1=String((dash[9]||[])[0]||"").trim()||found[0]||"Owner 1";
  const o2=String((dash[17]||[])[0]||"").trim()||found.find(x=>x.toLowerCase()!==o1.toLowerCase())||"Owner 2";
  S.settings.owner1=o1;S.settings.owner2=o2;
  const c1=num((dash[27]||[])[3]),c2=num((dash[28]||[])[3]);
  if(c1)S.settings.otherChg1=c1;if(c2)S.settings.otherChg2=c2;
  it.slice(1).forEach(r=>{
    const name=String(r[0]||"").trim();if(!name)return;
    S.skuCost[name]=num(r[2]);S.skuPack[name]=num(r[3]);
    S.skuOwner[name]=String(r[1]||"").trim().toLowerCase()===o2.toLowerCase()?"o2":"o1";
  });
  const rr=sheetRows(get("RETURNRTO"));
  rr.slice(1).forEach(r=>{
    const sub=String(r[1]||"").trim();if(!sub)return;
    const t=norm(r[2]);const ty=/\brto\b|courier/.test(t)?"RTO":(/customer/.test(t)?"Customer Return":"");
    if(ty){if(S.returnsMap[sub]===undefined)sum.returns++;S.returnsMap[sub]=ty}
  });
  /* every PAYMENTS row is one payment (an order can have a sale credit and a later deduction) — keep them all, like the Excel's SUMIF */
  const pays=sheetRows(get("PAYMENTS")),idx=settlementIndex(),occ={};
  pays.slice(1).forEach(r=>{
    const sub=String(r[1]||"").trim();if(!sub)return;
    addSettlement(idx,occ,sub,num(r[2]),true,isoDate(r[0]),sum);
  });
  const paidBy={};S.settlements.forEach(t=>{if(t.scheduled)paidBy[t.subOrder]=(paidBy[t.subOrder]||0)+t.amount});
  const od=sheetRows(get("ORDERS")),h=od[0].map(norm);
  const col=n=>h.findIndex(c=>c===n||c.startsWith(n));
  const iD=col("date"),iId=col("order id"),iIt=col("item"),iQ=col("qty"),iP=col("price");
  const seen=new Set(S.orders.map(o=>o.subOrder));
  od.slice(1).forEach(r=>{
    const sub=String(r[iId]||"").trim();if(!sub)return;
    if(seen.has(sub)){sum.dup++;return}
    seen.add(sub);
    const ret=S.returnsMap[sub];
    const st=ret==="RTO"?"RTO":ret==="Customer Return"?"Customer Return":((paidBy[sub]||0)>0?"Delivered":"Shipped");
    S.orders.push({subOrder:sub,order:sub,sku:String(r[iIt]||"").trim(),qty:Math.max(1,num(r[iQ])||1),price:num(r[iP]),status:st,date:isoDate(r[iD])});
    sum.added++;
  });
  sum.log.push("✓ Sales Manager workbook imported (owners: "+o1+" / "+o2+")");
}
function ingestWorkbook(wb,fileName,sum){
  const up=wb.SheetNames.map(n=>n.toUpperCase());
  if(["ORDERS","ITEMS","PAYMENTS","RETURNRTO"].every(n=>up.includes(n))){importSalesManager(wb,sum);return}
  for(const sn of wb.SheetNames){
    const rows=sheetRows(wb.Sheets[sn]);if(!rows.length)continue;
    const n=norm(sn);
    if(/\bads\b/.test(n)){extractSum(rows,"ads",["total ads cost"],fileName);sum.log.push("✓ Ads sheet read");continue}
    if(/referral/.test(n)){extractSum(rows,"referrals",["net referral amount"],fileName);sum.log.push("✓ Referral sheet read");continue}
    if(/compens|recover/.test(n)){extractSum(rows,"compensations",["amount inc gst","amount"],fileName);sum.log.push("✓ Compensation sheet read");continue}
    const head=rows.slice(0,12).map(r=>r.map(norm));
    const has=t=>head.some(r=>r.some(c=>c===t||c.includes(t)));
    if(has("final settlement amount")&&has("sub order no")){parsePaymentRows(rows,sum);continue}
    if(has("type of return")&&(has("suborder number")||has("sub order number"))){parseReturnRows(rows,sum);continue}
    if(has("sub order no")||has("suborder no")||has("sub order number")||has("suborder number")){
      try{const r=parseOrderRows(rows,fileName+" ["+sn+"]");sum.added+=r.added;sum.dup+=r.dup}catch(e){sum.log.push("⚠ "+e.message)}
    }
  }
}
async function handleFiles(files){
  const box=document.getElementById("impMsg");if(!box)return;
  box.className="msg";box.style.display="block";box.textContent="Reading files…";
  const sum={added:0,dup:0,returns:0,settled:0,pending:0,log:[]};
  for(const f of files){
    try{
      const wb=/\.xlsx?$/i.test(f.name)?XLSX.read(await f.arrayBuffer(),{type:"array"}):XLSX.read(await f.text(),{type:"string",raw:true});
      ingestWorkbook(wb,f.name,sum);
    }catch(e){sum.log.push("❌ "+f.name+": "+e.message)}
  }
  save();
  const parts=[];
  if(sum.added)parts.push(sum.added+" new orders");
  if(sum.returns)parts.push(sum.returns+" RTO/return tags");
  if(sum.settled)parts.push(sum.settled+" payments received");
  if(sum.pending)parts.push(sum.pending+" unscheduled payments");
  box.className="msg "+((parts.length||sum.dup)?"ok":"err");
  box.textContent=(parts.length?"Imported: "+parts.join(", ")+".":"Nothing new found in these files.")+(sum.dup?" ("+sum.dup+" duplicate orders skipped)":"")+(sum.log.length?"\n"+sum.log.join("\n"):"");
  render();
}

/* ============ CALC ============ */
function skuVal(obj,sku){return (obj&&typeof obj==="object")?num(obj[sku]):0}
function ownerOf(sku){if(!S.skuOwner||typeof S.skuOwner!=="object")return "o1";return S.skuOwner[sku]==="o2"?"o2":"o1"}
function ownerName(k){return k==="o2"?(S.settings.owner2||"Owner 2"):(S.settings.owner1||"Owner 1")}
function r2(x){return Math.round((x||0)*100)/100}
/* Same rules as the MEESHO_SALES_MANAGER sheet:
   - "Delivered" = payment received > 0, "Total sale" = every order that is not an RTO / customer return
   - profit is only booked for orders whose payment has actually arrived (cash basis)
   - RTO: no sale, no cost, NO packaging; customer return: packaging + the deduction Meesho actually made
   - a return with no deduction yet is not counted until the payment file arrives (unless you set an estimate in Settings) */
function calc(selMonth){
  const st=S.settings||DEF_SETTINGS;
  if(!S.skuOwner||typeof S.skuOwner!=="object")S.skuOwner={};
  const gstK=num(st.gstRate)/(100+num(st.gstRate));
  const paidMap={},pendMap={};
  (S.settlements||[]).forEach(t=>{if(t.scheduled)paidMap[t.subOrder]=(paidMap[t.subOrder]||0)+num(t.amount);else pendMap[t.subOrder]=num(t.amount)});
  let all=S.orders||[];
  if(selMonth)all=all.filter(x=>monthKey(x.date)===selMonth);
  const rm=S.returnsMap||{};
  const rows=[];let cancelled=0;
  all.forEach(x=>{
    const ret=rm[x.subOrder]||(x.status==="RTO"?"RTO":x.status==="Customer Return"?"Customer Return":"");
    if(x.status==="Cancelled"&&!ret){cancelled++;return}
    const qty=Math.max(1,num(x.qty)||1);
    const paid=paidMap[x.subOrder]||0;
    const price=ret==="RTO"?0:num(x.price)*qty;
    const cost=ret?0:skuVal(S.skuCost,x.sku)*qty;
    const pkg=ret==="RTO"?0:skuVal(S.skuPack,x.sku)*qty;
    const gst=ret?0:price*gstK;
    let retCost=0,est=false,counted=paid!==0;
    if(ret==="Customer Return"){
      if(paid<0)retCost=-paid;
      else if(paid===0&&num(st.returnLoss)>0){retCost=num(st.returnLoss);est=true;counted=true}
    }
    let K;
    if(ret==="RTO"){K=0;counted=false}
    else if(ret==="Customer Return")K=-(pkg+retCost);
    else{K=price-gst-cost-pkg;if(paid<=0)counted=false}
    rows.push({x,ret,qty,paid,price,cost,pkg,gst,retCost,est,K,counted,hasCost:!!(S.skuCost&&num(S.skuCost[x.sku])>0)});
  });
  const nonRet=rows.filter(r=>!r.ret);
  const delivered=nonRet.filter(r=>r.paid>0);
  const rto=rows.filter(r=>r.ret==="RTO"),returns=rows.filter(r=>r.ret==="Customer Return");
  const counted=rows.filter(r=>r.counted);
  const sum=(a,f)=>a.reduce((t,r)=>t+f(r),0);
  const totalSale=sum(nonRet,r=>r.price);
  const paymentRec=sum(rows,r=>r.paid);
  const saleCounted=sum(counted.filter(r=>!r.ret),r=>r.price);
  const productCost=sum(counted,r=>r.cost),packCost=sum(counted,r=>r.pkg),gst=sum(counted,r=>r.gst);
  const retLoss=sum(counted.filter(r=>r.ret==="Customer Return"),r=>r.retCost);
  const profitBase=sum(counted,r=>r.K);
  const oc=(selMonth?(S.otherCosts||[]).filter(c=>monthKey(c.date)===selMonth):(S.otherCosts||[])).reduce((a,c)=>a+num(c.amount),0);
  const other=num(st.otherFlat)+oc,ads=num(st.adsCost),rtoLoss=rto.length*num(st.rtoLoss);
  const netProfit=profitBase-other-ads-rtoLoss;
  const pendingRows=nonRet.filter(r=>r.paid===0).map(r=>{const m=pendMap[r.x.subOrder];return {...r,expected:m!==undefined?m:r.price,isEstimate:m===undefined}});
  const pendingValue=sum(pendingRows,r=>r.expected);
  const anomalies=nonRet.filter(r=>r.paid<0);
  const missingCost=[...new Set(rows.filter(r=>!r.ret&&!r.hasCost).map(r=>r.x.sku))];
  const waitingReturns=returns.filter(r=>r.paid===0).length;
  const owners={};
  const ensure=k=>owners[k]||(owners[k]={key:k,name:ownerName(k),sale:0,orders:0,delivered:0,rto:0,returns:0,paid:0,profit:0});
  rows.forEach(r=>{
    const w=ensure(ownerOf(r.x.sku));
    w.orders++;if(!r.ret)w.sale+=r.price;if(!r.ret&&r.paid>0)w.delivered++;
    if(r.ret==="RTO")w.rto++;if(r.ret==="Customer Return")w.returns++;
    w.paid+=r.paid;if(r.counted)w.profit+=r.K;
  });
  const sharedExtra=other+ads+rtoLoss;
  Object.keys(owners).forEach(k=>{
    const w=owners[k];
    w.share=totalSale>0?w.sale/totalSale:0;
    w.sharedCost=r2(w.share*sharedExtra);
    w.otherCharges=num(k==="o2"?st.otherChg2:st.otherChg1);
    w.paidNet=w.paid-w.otherCharges;
    w.profitNet=w.profit-w.sharedCost;
    w.pct=Math.round(w.share*100);
  });
  return {rows,orders:rows,totalOrders:rows.length,cancelled,totalSale,paymentRec,delivered,rto,returns,saleCounted,productCost,packCost,gst,retLoss,profitBase,other,ads,rtoLoss,netProfit,pendingRows,pendingValue,anomalies,missingCost,waitingReturns,ownerStats:owners};
}

  '<button class="btn" id="saveOwners">Save names</button></div>'+
  '<h3>Product cost prices + packaging cost</h3>'+
  '<p style="color:var(--mut);font-size:13px">Packaging cost is per-unit and counted on every packed unit (delivered, RTO, and customer return).</p>'+
  (skus.length?'<table><tr><th>SKU</th><th>Cost ₹</th><th>Other cost (packaging) ₹</th><th>Owner</th></tr>'+rows+'</table>':"<p style='color:var(--mut)'>No SKUs yet.</p>")+'</div>';
}
function vOther(){return '<div class="card"><h2>Other cost ledger</h2>'+
 '<div class="row"><div><label>Date</label><br><input type="date" id="ocd"></div><div><label>Amount ₹</label><br><input type="number" id="oca"></div><div><label>Note</label><br><input id="ocn"></div><button class="btn" id="addOc">Add</button></div>'+
 '<h3>'+(S.otherCosts||[]).length+' entries — '+fmt((S.otherCosts||[]).reduce((a,c)=>a+num(c.amount),0))+'</h3>'+
 (S.otherCosts&&S.otherCosts.length?'<table><tr><th>Date</th><th>Amount</th><th>Note</th></tr>'+S.otherCosts.map(c=>"<tr><td>"+dmy(c.date)+"</td><td>"+fmt(num(c.amount))+"</td><td>"+esc(c.note||"")+"</td></tr>").join("")+'</table>':"<p style='color:var(--mut)'>No entries yet.</p>")+'</div>'}
function vStock(){
  const skus=[...new Set((S.orders||[]).map(o=>o.sku).filter(Boolean))];
  let rows="";
  skus.forEach(s=>{
    const sold=calc("").delivered.filter(r=>r.x.sku===s).reduce((a,r)=>a+r.qty,0);
    const low=num(S.stock&&S.stock[s])<=num(S.settings.lowStock);
    rows+='<tr><td>'+esc(s)+'</td><td><input data-sku="'+esc(s)+'" class="stockIn" value="'+((S.stock&&S.stock[s]!=null)?S.stock[s]:"")+'"></td><td>'+sold+'</td><td>'+(low?'<span class="neg">⚠ Low stock</span>':"OK")+'</td></tr>';
  });
  return '<div class="card"><h2>Stock on hand</h2>'+(skus.length?'<table><tr><th>SKU</th><th>Current stock</th><th>Sold (delivered)</th><th>Status</th></tr>'+rows+'</table>':"<p style='color:var(--mut)'>No SKUs yet.</p>")+'</div>';
}
function vReturns(){
  const c=calc(""),r=c.returns;
  let rows="";
  r.forEach(x=>{
    const ded=x.paid<0?'<span class="neg">'+fmt(-x.paid)+'</span>':(x.est?'estimate '+fmt(x.retCost):'<span style="color:var(--mut)">waiting for payment file</span>');
    rows+='<tr><td>'+esc(x.x.subOrder)+'</td><td>'+esc(x.x.sku)+'</td><td>'+ded+'</td><td>'+(x.counted?fmt(x.pkg):"—")+'</td><td>'+(x.counted?'<b class="neg">'+fmt(x.pkg+x.retCost)+'</b>':"—")+'</td></tr>';
  });
  const tot=r.filter(x=>x.counted).reduce((a,x)=>a+x.pkg+x.retCost,0);
  return '<div class="card"><h2>Customer returns ('+r.length+')</h2>'+
  '<p style="color:var(--mut);font-size:13px">Loss on a return = the amount Meesho actually deducted (negative payment) + packaging. Until a payment file shows the deduction the return is not counted — exactly like your Excel. RTO orders cost nothing here (no packaging, no deduction).</p>'+
  (r.length?'<table><tr><th>Sub Order</th><th>Product</th><th>Meesho deduction</th><th>Packaging</th><th>Loss counted</th></tr>'+rows+
  '<tr><td colspan="4"><b>Total return loss (already inside Profit)</b></td><td><b class="neg">'+fmt(tot)+'</b></td></tr></table>':"<p style='color:var(--mut)'>No customer returns yet.</p>")+'</div>';
}
function vReceived(){const paid=(S.settlements||[]).filter(s=>s.scheduled);
  return '<div class="card"><h2>Received payment ('+paid.length+') — '+fmt(paid.reduce((a,s)=>a+num(s.amount),0))+'</h2>'+
  (paid.length?'<table><tr><th>Date</th><th>Sub Order</th><th>Settlement ₹</th></tr>'+paid.map(s=>"<tr><td>"+dmy(s.date)+"</td><td>"+esc(s.subOrder)+"</td><td class='"+(s.amount<0?'neg':'')+"'>"+fmt(s.amount)+"</td></tr>").join("")+'</table>':"<p style='color:var(--mut)'>No settlements yet — upload the payment file.</p>")+'</div>'}
function vPending(){const c=calc(""),pd=c.pendingRows;
  return '<div class="card"><h2>Pending payment ('+pd.length+') — '+fmt(c.pendingValue)+'</h2>'+
  '<p style="color:var(--mut);font-size:13px">Orders that are not RTO / returned and have no payment yet. "Meesho figure" = the unscheduled amount from the payment file; otherwise the sale price is shown as an estimate.</p>'+
  (pd.length?'<table><tr><th>Date</th><th>Sub Order</th><th>Product</th><th>Source</th><th>Expected ₹</th></tr>'+pd.map(r=>"<tr><td>"+dmy(r.x.date)+"</td><td>"+esc(r.x.subOrder)+"</td><td>"+esc(r.x.sku)+"</td><td>"+(r.isEstimate?"Estimate":"Meesho figure")+"</td><td>"+fmt(r.expected)+"</td></tr>").join("")+'</table>':"<p style='color:var(--mut)'>Nothing pending.</p>")+'</div>'}
function vSettings(){const s=S.settings;
  return '<div class="card"><h2>Calculation settings</h2><div class="row">'+
  '<div><label>Shop name</label><br><input id="sn" value="'+esc(s.shopName||"")+'"><br><small style="color:var(--mut)">Editable — shows on dashboard & sidebar</small></div>'+
  [["gstRate","GST rate %"],["returnLoss","Return estimate ₹ (0 = count only real Meesho deductions, like Excel)"],["adsCost","Ads cost ₹"],["otherFlat","Other cost flat ₹"],["rtoLoss","RTO loss ₹ per RTO (Excel uses 0)"],["otherChg1","Other charges — "+esc(s.owner1)+" ₹"],["otherChg2","Other charges — "+esc(s.owner2)+" ₹"],["lowStock","Low stock alert"]].map(p=>'<div><label>'+p[1]+'</label><br><input type="number" value="'+num(s[p[0]])+'" data-set="'+p[0]+'"></div>').join("")+
  '<button class="btn" id="saveShop">Save shop name</button></div>'+
  '<h3>Cloud sync status</h3>'+cloudBadgeHTML()+
  '<button class="btn" id="pullBtn" style="margin-top:8px">⬇ Pull latest from cloud now</button>'+
  '<h3 style="margin-top:16px">Backup & restore</h3><button class="btn" id="dlBtn">⬇ Download backup (JSON)</button>'+
  '<label class="btn gray" style="display:inline-block">⬆ Restore backup<input type="file" accept=".json" id="rsFile" style="display:none"></label>'+
  '<h3 style="margin-top:16px">Cloud database (Supabase)</h3>'+
  '<p style="color:var(--mut);font-size:13px">Data auto-saves in this browser AND syncs to Supabase when URL + anon key are set. Use "Pull latest" to load cloud data onto a new device.</p>'+
  '<div class="row"><input id="su" placeholder="Supabase URL" value="'+esc(s.supabaseUrl)+'" style="flex:1;min-width:200px"><input id="sk" placeholder="Anon key" value="'+esc(s.supabaseKey)+'" style="flex:1;min-width:200px"><button class="btn" id="saveCloud">Save & test</button></div>'+
  '<details><summary>Show setup SQL (run once in Supabase → SQL Editor)</summary>'+
  '<pre id="supaSql">create table if not exists appdata (\n'+
  '  id bigint primary key,\n'+
  '  payload text not null default \x27{}\x27,\n'+
  '  updated_at timestamptz not null default now()\n'+
  ');\n\n'+
  'alter table appdata enable row level security;\n\n'+
  'create policy "anon can read/write appdata"\n'+
  '  on appdata for all\n'+
  '  using (true) with check (true);\n\n'+
  'insert into appdata (id, payload)\n'+
  'values (1, \x27{}\x27)\n'+
  'on conflict (id) do nothing;</pre>'+
  '<button class="btn gray" id="copySql" style="margin-top:6px">Copy SQL</button>'+
  '<p style="color:var(--mut);font-size:11.5px;margin-top:6px">This creates one shared row (id=1) that this app reads/writes as a whole — it mirrors exactly what the Save/Pull buttons above call. The anon key is public-readable by design here; don\u2019t put anything sensitive beyond your own business numbers in it.</p>'+
  '</details>'+
  '</div>';
}

/* ============ EVENT WIRING ============ */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.sku&&(t.dataset.field==="skuCost"||t.dataset.field==="skuPack"))setCost(t.dataset.sku,t.dataset.field,t.value);
  if(t.classList&&t.classList.contains("stockIn"))setStock(t.dataset.sku,t.value);
  if(t.classList&&t.classList.contains("lossIn"))setLoss(t.dataset.sub,t.value);
  if(t.dataset&&t.dataset.set){S.settings[t.dataset.set]=num(t.value);save();}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("ownerSel"))setOwner(t.dataset.sku,t.value);
  if(t.id==="fp"&&t.files.length)handleFiles([...t.files]);
  if(t.id==="rsFile"&&t.files.length)restore(t.files[0]);
});
document.addEventListener("click",e=>{
  if(e.target.closest("#dz")&&!e.target.closest("input")){const fp=document.getElementById("fp");if(fp)fp.click();}
  if(e.target.closest("#clearLegacy")){S.orders=[];S.settlements=[];S.returnsMap={};S.fileSums={};S.payments={};S.legacyData=false;save();render();return}
  if(e.target.closest("#resetBtn")){if(confirm("Reset ALL data for this business?")){S=blankState();save();renderNav();render();}}
  if(e.target.closest("#saveOwners")){S.settings.owner1=document.getElementById("o1").value;S.settings.owner2=document.getElementById("o2").value;save();render();}
  if(e.target.closest("#addOc")){S.otherCosts.push({date:document.getElementById("ocd").value,amount:num(document.getElementById("oca").value),note:document.getElementById("ocn").value});save();render();}
  if(e.target.closest("#saveShop")){S.settings.shopName=document.getElementById("sn").value;save();renderNav();render();}
  if(e.target.closest("#dlBtn"))downloadBackup();
  if(e.target.closest("#saveCloud")){
    S.settings.supabaseUrl=sanitizeSupabaseUrl(document.getElementById("su").value);
    S.settings.supabaseKey=cleanText(document.getElementById("sk").value);
    localStorage.setItem("meeshoPortal",JSON.stringify(S));
    if(!cloudReady()){
      const reason=!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(S.settings.supabaseUrl)
        ? "⚠ URL doesn't look right. App read it as: \u201C"+S.settings.supabaseUrl+"\u201D ("+S.settings.supabaseUrl.length+" characters) — it should look like https://xxxx.supabase.co"
        : "⚠ Anon key looks too short — make sure the whole key got pasted";
      setCloudBadge(false,reason);render();
      return;
    }
    setCloudBadge(true,"☁ Connecting…");render();
    cloudPull().then(found=>{
      // No existing row in the cloud yet means this is the first device to
      // connect — safe to seed the cloud with what's on this device. If a
      // row DID exist, cloudPull already adopted it, and we must NOT push
      // afterwards or we'd immediately clobber it with the pre-pull state.
      if(found===false)cloudPush();
      renderNav();render();
    });
  }
  if(e.target.closest("#pullBtn"))cloudPull().then(ok=>{if(ok!==false){renderNav();render();}});
  if(e.target.closest("#copySql")){const t=document.getElementById("supaSql").textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);}
});
document.addEventListener("dragover",e=>{if(cur!=="Upload data")return;e.preventDefault();const dz=document.getElementById("dz");if(dz)dz.classList.add("over")});
document.addEventListener("dragleave",()=>{const dz=document.getElementById("dz");if(dz)dz.classList.remove("over")});
document.addEventListener("drop",e=>{if(cur!=="Upload data")return;e.preventDefault();const dz=document.getElementById("dz");if(dz)dz.classList.remove("over");if(e.dataTransfer.files.length)handleFiles([...e.dataTransfer.files])});
function downloadBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="meesho-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
function restore(f){const r=new FileReader();r.onload=()=>{try{S=normalize(JSON.parse(r.result));save();renderNav();render();alert("Backup restored")}catch(e){alert("Invalid backup file")}};r.readAsText(f)}

/* ============ STARTUP: pull cloud data if newer ============ */
async function startup(){
  renderNav();render();
  if(cloudReady()){
    const before=JSON.stringify(S);
    await cloudPull();
    if(JSON.stringify(S)!==before){renderNav();render();}
  }
}
startup();
</script>
</body>
</html>
